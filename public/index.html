<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareLoop</title><link rel="stylesheet" href="/style.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet"></head>
<body><main id="auth" class="auth"><div class="brand">CareLoop</div><p class="tag">Quiet care for the people you love.</p>
<div class="card"><input id="elder" placeholder="Your relative's name" maxlength="60"><input id="email" type="email" placeholder="Email" maxlength="120">
<input id="pw" type="password" placeholder="Password (8+ characters)" maxlength="72"><p id="err" class="err" role="alert"></p>
<button id="reg">Create account</button><button id="log" class="ghost">Log in</button></div></main>
<main id="app" hidden><header><div class="brand sm">CareLoop</div><button id="out" class="ghost">Log out</button></header>
<section id="hero" class="hero l0"><div class="ring"><span id="lvl">0</span></div><div><h1 id="who"></h1><h2 id="act"></h2><p id="why"></p></div></section>
<section class="ladder" id="ladder"></section>
<div class="grid"><section class="card"><h3>Log activity</h3><div class="chips" id="chips"></div>
<h3>Demo scenarios</h3><button id="s1">Normal day</button> <button id="s2" class="warn">Missed routine</button></section>
<section class="card"><h3>Alerts</h3><ul id="alerts"></ul></section>
<section class="card"><h3>Recent activity</h3><ul id="events"></ul></section></div></main>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true"><div class="box"><div id="mt" class="mt"></div><div id="mb" class="mb"></div><button id="mok"></button> <button id="mx" class="ghost">Close</button></div></div>
<script src="/app.js"></script></body></html>
